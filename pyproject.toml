[project]
name = "cds-tools"
version = "0.2.0"
description = "MCP server e CLI (somente leitura) para o Blackboard Ultra da Cruzeiro do Sul / Unipê. Projeto não oficial."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "playwright>=1.45",
    "pypdf>=5",
]

[project.scripts]
cds-tools = "cds_tools.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cds_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
